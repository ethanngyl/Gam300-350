# Ruff config for the Python reconstruction tools (tools/*.py).
# README requires Python 3.10+.
target-version = "py310"
line-length = 88

# Never lint generated, vendored, or build output.
extend-exclude = [
    "engine/Library",
    "engine/build",
    "**/_deps/**",
    "**/node_modules/**",
    "**/dist/**",
]

[lint]
# Ruff's default rule set (Pyflakes + the essential pycodestyle checks) plus a
# few low-noise upgrades. Kept conservative while the codebase adopts linting;
# expand once the team is comfortable.
select = ["E", "F", "W", "I", "UP", "B"]
# Line length is the formatter's job (`ruff format`); don't double-report it.
ignore = ["E501"]
