components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: genesis_session
      description: Set by POST /auth/login or /auth/signup (HttpOnly). Browsers send it automatically; other clients send it back as a Cookie header.
    authorityKey:
      type: apiKey
      in: header
      name: X-Auth-Key
      description: The shared AUTH_API_KEY (team machines -> VM only). Never sent by browsers.

  headers:
    SessionCookie:
      description: The session cookie (HttpOnly; Secure over HTTPS). Without "remember" it ends when the browser closes.
      schema: { type: string }
      example: genesis_session=Q2x4b1h3cXZ...; Max-Age=604800; Path=/; HttpOnly; SameSite=Lax

  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[\w-]+$' }
      example: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23
    ImageName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[\w.-]+\.(jpe?g|png)$' }
      example: 0000.jpg
    SceneId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^[\w-]{1,64}$' }
      example: 3d1f5c2e-8a4b-4e6f-9c0d-1a2b3c4d5e6f
    Range:
      name: Range
      in: header
      required: false
      schema: { type: string }
      example: bytes=0-4095
    ActAsUser:
      name: X-Act-As-User
      in: header
      required: true
      description: The id of the user the team machine is acting for. The VM looks the user (and their role) up in its own database.
      schema: { type: integer }
      example: 7
    FeedbackCategory:
      name: category
      in: query
      required: false
      description: Only this category (a catalog id); anything else means all
      schema: { type: string }
      example: bug
    FeedbackBefore:
      name: before
      in: query
      required: false
      description: Only messages older than this id ("Load more")
      schema: { type: integer }
      example: 120

  requestBodies:
    SignUp:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, email, password]
            properties:
              name: { type: string }
              email: { type: string }
              password: { type: string, minLength: 6 }
              remember: { type: boolean }
          example: { name: Alice, email: alice@example.com, password: correct-horse-battery, remember: true }
    Rename:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name: { type: string, minLength: 1, maxLength: 80 }
          example: { name: Alice Tan }
    RenameJob:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name: { type: string, maxLength: 80, description: Empty resets to the default name }
          example: { name: Fox on the desk }
    ChangePassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [currentPassword, newPassword]
            properties:
              currentPassword: { type: string }
              newPassword: { type: string, minLength: 6 }
          example: { currentPassword: correct-horse-battery, newPassword: staple-battery-horse-7 }
    Avatar:
      required: true
      content:
        image/jpeg:
          schema: { type: string, format: binary }
          example: (a 256 x 256 JPEG, as raw bytes)
        image/png:
          schema: { type: string, format: binary }
          example: (a PNG, as raw bytes)
    Feedback:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FeedbackInput' }
          example: { category: bug, message: The upload bar stops at 99% on large batches. }
    SceneInput:
      required: true
      description: A scene of any format version. Version 0 is the browser-only format (no format / version fields).
      content:
        application/json:
          schema: { type: object }
          examples:
            version1:
              summary: A version 1 scene
              value:
                format: genesis.scene
                version: 1
                id: 3d1f5c2e-8a4b-4e6f-9c0d-1a2b3c4d5e6f
                name: Living room
                createdAt: 1791101700000
                updatedAt: 1791188100000
                background: '#18181b'
                renderMode: splats
                objects:
                  - { objectId: obj-1, jobId: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23, name: Fox, position: [1, 0, -2.5], rotation: [0, 90, 0], scale: [1.5, 1.5, 1.5], trim: { strength: 0.3, minOpacity: 0.1, maxSplatSize: 0, density: 0 }, isHidden: false }
            version0:
              summary: A version 0 scene (converted when saved)
              value:
                name: Living room
                background: '#18181b'
                renderMode: splats
                objects:
                  - { objectId: obj-1, jobId: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23, name: Fox, position: [1, 0, -2.5], rotation: [0, 90, 0], scale: [1.5, 1.5, 1.5] }

  responses:
    Unauthorized:
      description: Not signed in (no session cookie, or it has expired)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Please sign in first. }
    Forbidden:
      description: Signed in, but not an admin
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Only admins can do this. }
    KeyRefused:
      description: The shared key is missing or wrong
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Unauthorized. }
    KeyOrUserRefused:
      description: The shared key is missing or wrong, or X-Act-As-User names no known user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Unauthorized. }
    NotAuthority:
      description: This server is not the VM (AUTH_MODE isn't authority)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This server is not the account authority. }
    BadRequest:
      description: The request's input is invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Enter a valid email address. }
    BodyTooLarge:
      description: A JSON body over the server's limit (2 MB; config.maxJsonBodyMB)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: That request is too large. }
    TooLarge:
      description: A file or message is over its limit
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: That file is too large -- each photo must be under 30 MB. }
    TooManyAttempts:
      description: A rate limit was reached (Retry-After says when to try again)
      headers:
        Retry-After:
          schema: { type: integer }
          example: 840
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Too many attempts. Try again in 14 minutes. }
    Unavailable:
      description: A team machine can't reach the VM, or the service isn't set up here
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: The account service is unavailable. Try again shortly. }
    NoPassword:
      description: The account signs in with Google only
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This account signs in with Google, so it has no password to change. }
    Account:
      description: The account's details
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Account' }
          example:
            name: Alice
            email: alice@example.com
            role: user
            createdAt: 1791101700000
            memberSince: 4 October 2026
            emailVerified: false
            passwordChangedAt: 1792666200000
            signInMethods: { password: true, google: false }
            photoVersion: 1792666300000
    Avatar:
      description: The profile photo (ETag; no-cache)
      headers:
        ETag:
          schema: { type: string }
          example: '"avatar-7-1792666300000"'
      content:
        image/jpeg:
          schema: { type: string, format: binary }
          example: (JPEG bytes)
        image/png:
          schema: { type: string, format: binary }
          example: (PNG bytes)
    NoAvatar:
      description: No profile photo is set
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: No profile photo. }
    Storage:
      description: Bytes used by the user's own jobs
      content:
        application/json:
          schema:
            type: object
            required: [usedBytes, models, jobs]
            properties:
              usedBytes: { type: integer, minimum: 0 }
              models: { type: integer, minimum: 0, description: Finished jobs }
              jobs: { type: integer, minimum: 0, description: All jobs, including failed and running }
          example: { usedBytes: 734003200, models: 6, jobs: 9 }
    JobList:
      description: The jobs, newest first
      content:
        application/json:
          schema:
            type: array
            items: { $ref: './schemas/job-summary.schema.json' }
          example:
            - id: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23
              name: Fox on the desk
              status: done
              phase: done
              progress: 1
              detail: null
              error: null
              createdAt: 1791101700000
              updatedAt: 1791102900000
              imageCount: 2
              hasResult: true
              thumbnail: /api/v1/jobs/7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23/images/0000.jpg
              cover: /api/v1/jobs/7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23/cover.webp
              images:
                - { name: 0000.jpg, url: /api/v1/jobs/7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23/images/0000.jpg }
                - { name: 0001.jpg, url: /api/v1/jobs/7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23/images/0001.jpg }
    JobStatus:
      description: The job's state (the last 40 log lines in logTail)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobStatus' }
          example:
            id: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23
            status: running
            phase: training
            progress: 0.62
            detail: null
            error: null
            updatedAt: 1791102300000
            imageCount: 24
            removeBackground: false
            hasResult: false
            logTail: ['Training step 4200 / 7000']
    JobNotFound:
      description: No such job, or it isn't the caller's (someone else's job is 404, not 403)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: job not found }
    JobRenamed:
      description: Renamed
      content:
        application/json:
          schema:
            type: object
            required: [id, name, sampleFile]
            properties:
              id: { type: string }
              name: { type: ['string', 'null'] }
              sampleFile: { type: string, description: The model's copy in the engine's samples folder }
          example: { id: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23, name: Fox on the desk, sampleFile: Fox on the desk.ply }
    RenameBlocked:
      description: The engine's copy of the model couldn't be renamed (open in another program)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: Couldn't rename 7f3c2a10.ply in the engine samples folder (EBUSY). Close any program using it and try again. }
    JobCancelled:
      description: Cancelled (also when it already was)
      content:
        application/json:
          schema:
            type: object
            required: [id, status]
            properties:
              id: { type: string }
              status: { const: cancelled }
          example: { id: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23, status: cancelled }
    JobFinished:
      description: The job already finished
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: job already done }
    JobDeleted:
      description: Deleted for good
      content:
        application/json:
          schema:
            type: object
            required: [id, deleted]
            properties:
              id: { type: string }
              deleted: { const: true }
          example: { id: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23, deleted: true }
    Photo:
      description: The photo
      content:
        image/jpeg:
          schema: { type: string, format: binary }
          example: (JPEG bytes)
        image/png:
          schema: { type: string, format: binary }
          example: (PNG bytes)
    ImageNotFound:
      description: No such photo, or the job isn't the caller's
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: image not found }
    Model:
      description: The whole model
      headers:
        Accept-Ranges:
          schema: { type: string }
          example: bytes
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
          example: "ply\nformat binary_little_endian 1.0\nelement vertex 412873\n... (binary splat data)"
    ModelRange:
      description: The requested byte range (the viewer first reads bytes 0-4095)
      headers:
        Content-Range:
          schema: { type: string }
          example: bytes 0-4095/48211932
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
          example: "ply\nformat binary_little_endian 1.0\n... (the first 4096 bytes)"
    ResultNotReady:
      description: No finished model (still running, failed, or not the caller's)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: result not ready }
    Cover:
      description: The cut-out cover (WebP), cached for a day
      content:
        image/webp:
          schema: { type: string, format: binary }
          example: (WebP bytes)
    NoCover:
      description: No cover (no background masks); show the first photo instead
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: no cover }
    SceneList:
      description: Scene summaries, newest first
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              required: [id, name, updatedAt, objectCount]
              properties:
                id: { type: string }
                name: { type: string }
                updatedAt: { type: integer }
                objectCount: { type: integer, minimum: 0 }
          example:
            - { id: 3d1f5c2e-8a4b-4e6f-9c0d-1a2b3c4d5e6f, name: Living room, updatedAt: 1791188100000, objectCount: 3 }
    Scene:
      description: The scene exactly as saved (format version 1)
      content:
        application/json:
          schema: { $ref: './schemas/scene.v1.schema.json' }
          example:
            format: genesis.scene
            version: 1
            id: 3d1f5c2e-8a4b-4e6f-9c0d-1a2b3c4d5e6f
            name: Living room
            createdAt: 1791101700000
            updatedAt: 1791188100000
            background: '#18181b'
            renderMode: splats
            objects:
              - { objectId: obj-1, jobId: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23, name: Fox, position: [1, 0, -2.5], rotation: [0, 90, 0], scale: [1.5, 1.5, 1.5], trim: { strength: 0.3, minOpacity: 0.1, maxSplatSize: 0, density: 0 }, isHidden: false }
    BadScene:
      description: Not a valid scene
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'The scene is not valid: /objects/0/position must NOT have fewer than 3 items' }
    SceneTooNew:
      description: Saved by a newer format version than this server reads
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: This scene was saved by a newer version (format 2; this server reads up to 1). }
    SceneNotFound:
      description: No such scene, or it isn't the caller's
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: scene not found }
    FeedbackCreated:
      description: Stored
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id: { type: integer }
          example: { id: 121 }
    FeedbackPage:
      description: One page of feedback (50), newest first
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FeedbackPage' }
          example:
            items:
              - { id: 121, name: Alice, email: alice@example.com, category: bug, message: The upload bar stops at 99% on large batches., origin: bryans-pc, createdAt: 1792666500000 }
            hasMore: false

  examples:
    User:
      value: { name: Alice, email: alice@example.com, role: user, createdAt: 1791101700000, memberSince: 4 October 2026 }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: A message that can be shown to the user }
    User:
      type: object
      required: [name, email, role, createdAt, memberSince]
      properties:
        name: { type: string }
        email: { type: string }
        role: { enum: [user, admin] }
        createdAt: { type: integer, description: UTC epoch milliseconds }
        memberSince: { type: string, description: e.g. "4 October 2026" }
    VmUser:
      type: object
      required: [id, email, name, role]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { enum: [user, admin] }
    Account:
      type: object
      required: [name, email, role, createdAt, memberSince, emailVerified, passwordChangedAt, signInMethods, photoVersion]
      properties:
        name: { type: string }
        email: { type: string }
        role: { enum: [user, admin] }
        createdAt: { type: integer }
        memberSince: { type: string }
        emailVerified: { type: boolean, description: true for Google accounts (Google checked the address) }
        passwordChangedAt: { type: ['integer', 'null'], description: null if never changed since sign-up }
        signInMethods:
          type: object
          required: [password, google]
          properties:
            password: { type: boolean }
            google: { type: boolean }
        photoVersion: { type: ['integer', 'null'], description: Changes with each new photo; null when there is none }
    JobStatus:
      type: object
      required: [id, status, phase, progress, detail, error, updatedAt, imageCount, removeBackground, hasResult, logTail]
      properties:
        id: { type: string }
        status: { enum: [queued, running, done, error, cancelled] }
        phase: { type: ['string', 'null'] }
        progress: { type: number, minimum: 0, maximum: 1 }
        detail: { type: ['string', 'null'] }
        error: { type: ['string', 'null'] }
        updatedAt: { type: ['number', 'null'] }
        imageCount: { type: ['integer', 'null'] }
        removeBackground: { type: boolean }
        hasResult: { type: boolean }
        logTail: { type: array, items: { type: string } }
    FeedbackInput:
      type: object
      required: [category, message]
      properties:
        category: { type: string, description: A catalog feedback category id (bug, idea, other) }
        message: { type: string, minLength: 10, maxLength: 1000 }
    FeedbackPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, name, email, category, message, origin, createdAt]
            properties:
              id: { type: integer }
              name: { type: string }
              email: { type: string }
              category: { type: string }
              message: { type: string }
              origin: { type: ['string', 'null'] }
              createdAt: { type: integer }
        hasMore: { type: boolean }
    CatalogResponse:
      type: object
      required: [version, minPhotos, feedbackCategories, feedbackMessage, trainingPresets, defaultTrainingPreset, limits]
      properties:
        version: { $ref: './schemas/catalog.schema.json#/properties/version' }
        minPhotos: { $ref: './schemas/catalog.schema.json#/properties/minPhotos' }
        feedbackCategories: { $ref: './schemas/catalog.schema.json#/properties/feedbackCategories' }
        feedbackMessage: { $ref: './schemas/catalog.schema.json#/properties/feedbackMessage' }
        trainingPresets: { $ref: './schemas/catalog.schema.json#/properties/trainingPresets' }
        defaultTrainingPreset: { $ref: './schemas/catalog.schema.json#/properties/defaultTrainingPreset' }
        limits:
          type: object
          required: [maxPhotos, maxPhotoSizeMB, maxMediaFiles, maxMediaSizeMB, maxFrameFps, minTrainIters, maxTrainIters, maxAvatarKB]
          properties:
            maxPhotos: { type: integer }
            maxPhotoSizeMB: { type: number }
            maxMediaFiles: { type: integer }
            maxMediaSizeMB: { type: number }
            maxFrameFps: { type: number }
            minTrainIters: { type: integer }
            maxTrainIters: { type: integer }
            maxAvatarKB: { type: number }
    PerformanceReport:
      type: object
      required: [window, from, to, api, pageLoad]
      properties:
        window: { enum: ['1h', '24h', '7d'] }
        from: { type: integer, description: UTC epoch ms }
        to: { type: integer, description: UTC epoch ms }
        api:
          type: array
          description: One entry per route ("METHOD /pattern", the same for /api/v1 and the legacy paths; "(no route)" for unknown paths), slowest p95 first
          items:
            type: object
            required: [route, count, errors, mean, p50, p95, p99, max]
            properties:
              route: { type: string }
              count: { type: integer, minimum: 1 }
              errors: { type: integer, minimum: 0, description: Replies with a 5xx status }
              mean: { type: number }
              p50: { type: number }
              p95: { type: number }
              p99: { type: number }
              max: { type: number }
        pageLoad:
          type: array
          items:
            type: object
            required: [metric, count, mean, p50, p95, p99, max]
            properties:
              metric: { enum: [ttfb, fcp, domContentLoaded, load] }
              count: { type: integer, minimum: 1 }
              mean: { type: number }
              p50: { type: number }
              p95: { type: number }
              p99: { type: number }
              max: { type: number }
