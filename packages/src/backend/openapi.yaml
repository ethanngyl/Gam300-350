openapi: 3.1.0
info:
  title: Genesis backend API
  version: 1.0.0
  summary: Turn photos or videos of an object into a 3D Gaussian Splat model.
  description: |
    The HTTP API of the Genesis backend (packages/src/backend), used by the
    website, the engine and the curl test client (packages/api-tests).

    **Versions.** Every path below is under `/api/v1`. The same routes also
    answer at the old unversioned paths (`/auth/me`, ...): those are
    deprecated and send `Deprecation` and `Link: rel="successor-version"`
    headers. In the legacy shape, users', account and feedback dates are ISO
    text instead of milliseconds. Changes are listed in docs/api-changelog.md:
    a breaking change means `/api/v2`, and v1 keeps working.

    **Signing in.** `POST /auth/login` (or `/auth/signup`) sets an HttpOnly
    session cookie, `genesis_session`, which every protected call sends back.
    Without it, protected calls answer 401. Passwords are stored only as
    salted scrypt hashes, and session tokens only as SHA-256 hashes.

    **Machine to machine.** The `/library/...` routes, `/register` and
    `/verify-account` are for the team's own backends talking to the VM: they
    need the shared key (`X-Auth-Key`) and say which user they act for
    (`X-Act-As-User`). A team machine answers its users' requests by passing
    them on to these.

    **Formats.** Dates are UTC epoch milliseconds, sizes are bytes, ids are
    UUIDs (see docs/data-schema.md). Errors are `{ "error": "..." }`. JSON
    request bodies may be up to 2 MB (a saved scene of 500 objects fits).
servers:
  - url: /api/v1
    description: The same server that serves the website (http://localhost:5005 locally)
tags:
  - name: Auth
    description: Signing up, in and out
  - name: Account
    description: The signed-in user's account page
  - name: Jobs
    description: Reconstruction jobs (a photo batch and the 3D model made from it)
  - name: Scenes
    description: Scene Builder scenes saved to the account
  - name: Feedback
    description: Feedback from the website, and the admins' inbox
  - name: Catalog
    description: Reference data and API documentation
  - name: Metrics
    description: API response times and website load times (p50 / p95 / p99), per machine
  - name: VM
    description: Machine-to-machine routes on the VM (shared key required)

paths:
  # ------------------------------------------------------------------ Auth
  /auth/signup:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Create an account and sign in
      description: New accounts are role `user`. At most 10 sign-ups per IP address per hour.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/SignUp'
      responses:
        '201':
          description: Created and signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              examples: { user: { $ref: '#/components/examples/User' } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: The email is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: An account with that email already exists. }
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/login:
    post:
      tags: [Auth]
      operationId: logIn
      summary: Sign in
      description: |
        Unknown email and wrong password get the same 401. After 10 wrong
        passwords in 15 minutes the email is locked until the window ends (429),
        and each IP address may try 30 times per 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                remember: { type: boolean, description: true keeps the login for 7 days after the browser closes }
            example: { email: alice@example.com, password: correct-horse-battery, remember: true }
      responses:
        '200':
          description: Signed in
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              examples: { user: { $ref: '#/components/examples/User' } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Incorrect email or password. }
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Who is signed in
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
              examples: { user: { $ref: '#/components/examples/User' } }
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Account]
      operationId: renameMe
      summary: Change the display name
      security: [{ sessionCookie: [] }]
      requestBody:
        $ref: '#/components/requestBodies/Rename'
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logOut
      summary: Sign out
      description: Deletes the session and clears the cookie. Safe when already signed out.
      security: []
      responses:
        '204':
          description: Signed out
          headers:
            Set-Cookie:
              description: Clears the session cookie
              schema: { type: string }
              example: genesis_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT
  /auth/google:
    get:
      tags: [Auth]
      operationId: startGoogleSignIn
      summary: Start Google sign-in (browser navigation)
      description: |
        On the VM, redirects to Google's account chooser with a one-use state
        cookie. On other machines, redirects to the VM's /auth/google.
      security: []
      responses:
        '302':
          description: Redirect to Google (or the VM)
          headers:
            Location:
              schema: { type: string }
              example: https://accounts.google.com/o/oauth2/v2/auth?client_id=1234.apps.googleusercontent.com&redirect_uri=https%3A%2F%2Fvm.example%2Fauth%2Fgoogle%2Fcallback&response_type=code&scope=openid+email+profile&state=Qk2x9fW1&prompt=select_account
        '503':
          description: Google sign-in isn't set up here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Google sign-in is not available here. }
  /auth/google/callback:
    get:
      tags: [Auth]
      operationId: finishGoogleSignIn
      summary: Google's redirect back after sign-in
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string }, example: 4/0AVG7fiQ-code-from-google }
        - { name: state, in: query, schema: { type: string }, example: Qk2x9fW1 }
        - { name: error, in: query, schema: { type: string }, example: access_denied }
      responses:
        '302':
          description: Signed in (to /) or failed (to /?login=google_failed or google_denied)
          headers:
            Location:
              schema: { type: string }
              example: /
        '503':
          description: Google sign-in isn't set up here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Google sign-in is not available here. }

  # --------------------------------------------------------------- Account
  /auth/me/account:
    get:
      tags: [Account]
      operationId: getAccount
      summary: The account page's details
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/me/password:
    post:
      tags: [Account]
      operationId: changePassword
      summary: Change the password
      description: Wrong current passwords count towards the login limit. Every other browser signed in to the account is signed out.
      security: [{ sessionCookie: [] }]
      requestBody:
        $ref: '#/components/requestBodies/ChangePassword'
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/NoPassword'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/me/avatar:
    get:
      tags: [Account]
      operationId: getAvatar
      summary: The profile photo
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Avatar'
        '304':
          description: Unchanged since the ETag sent in If-None-Match
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoAvatar'
    put:
      tags: [Account]
      operationId: setAvatar
      summary: Set the profile photo
      description: The body is the image itself (a real JPEG or PNG, at most 256 KB).
      security: [{ sessionCookie: [] }]
      requestBody:
        $ref: '#/components/requestBodies/Avatar'
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Account]
      operationId: deleteAvatar
      summary: Remove the profile photo
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '503':
          $ref: '#/components/responses/Unavailable'
  /auth/me/storage:
    get:
      tags: [Account]
      operationId: getStorage
      summary: How much the user's jobs take up
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Storage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'

  # ------------------------------------------------------------------ Jobs
  /upload:
    post:
      tags: [Jobs]
      operationId: uploadPhotos
      summary: Start a job from photos
      description: |
        8 or more JPEG / PNG photos (at most 300, 30 MB each). Returns at once;
        COLMAP and Brush run in the background, so poll GET /jobs/{id}.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images: { type: array, items: { type: string, format: binary } }
                trainIters: { type: integer, minimum: 1000, maximum: 30000, description: Training iterations (a catalog preset) }
                removeBackground: { type: string, enum: ['true', 'false'] }
            example: { images: [0001.jpg, 0002.jpg, 0003.jpg, 0004.jpg, 0005.jpg, 0006.jpg, 0007.jpg, 0008.jpg], trainIters: 7000, removeBackground: 'false' }
      responses:
        '202':
          description: The job started
          content:
            application/json:
              schema:
                type: object
                required: [id, imageCount]
                properties:
                  id: { type: string }
                  imageCount: { type: integer }
              example: { id: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23, imageCount: 24 }
        '400':
          description: Fewer than 8 photos, or a file that isn't a real JPEG / PNG
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Need at least 8 photos (got 5). More overlapping photos = better reconstruction. }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
  /jobs/from-media:
    post:
      tags: [Jobs]
      operationId: uploadMedia
      summary: Start a job from videos or animated GIFs
      description: Frames are extracted on the server, then the same pipeline runs. Up to 10 files, 2048 MB each.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [media]
              properties:
                media: { type: array, items: { type: string, format: binary } }
                fps: { type: number, description: Frames per second to extract (at most 30) }
                maxFrames: { type: integer, description: Most frames to extract }
                trainIters: { type: integer, minimum: 1000, maximum: 30000 }
                removeBackground: { type: string, enum: ['true', 'false'] }
            example: { media: [turntable.mp4], fps: 2, maxFrames: 120, trainIters: 7000, removeBackground: 'true' }
      responses:
        '202':
          description: The job started
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
              example: { id: 0b9d4e6a-2f1c-4a8b-b3d5-6e7f8a9b0c1d }
        '400':
          description: No usable video or GIF
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: '"notes.mp4" isn''t a video or GIF file.' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: The user's jobs, newest first
      description: Admins see every job. Where the jobs come from is set by JOB_SOURCES (this machine, the VM's library, sample jobs).
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/JobList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /jobs/{id}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Poll a job
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/JobStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/JobNotFound'
    patch:
      tags: [Jobs]
      operationId: renameJob
      summary: Rename a job (its model and photo batch)
      description: An empty name resets it to the default.
      security: [{ sessionCookie: [] }]
      requestBody:
        $ref: '#/components/requestBodies/RenameJob'
      responses:
        '200':
          $ref: '#/components/responses/JobRenamed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          $ref: '#/components/responses/RenameBlocked'
    delete:
      tags: [Jobs]
      operationId: cancelJob
      summary: Cancel a running job
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/JobCancelled'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          $ref: '#/components/responses/JobFinished'
  /jobs/{id}/files:
    parameters:
      - $ref: '#/components/parameters/JobId'
    delete:
      tags: [Jobs]
      operationId: deleteJob
      summary: Delete a job for good (photos, model, everything)
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/JobDeleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '502':
          description: The VM's copy couldn't be deleted (team machine)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: Couldn't delete it from the shared library. Try again shortly. }
  /jobs/{id}/images/{name}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/ImageName'
    get:
      tags: [Jobs]
      operationId: getJobImage
      summary: One of a job's photos
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Photo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ImageNotFound'
  /jobs/{id}/result.ply:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Jobs]
      operationId: getJobModel
      summary: Download the finished model (.ply)
      description: Supports byte ranges (`Range`), HEAD and ETag.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Range'
      responses:
        '200':
          $ref: '#/components/responses/Model'
        '206':
          $ref: '#/components/responses/ModelRange'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ResultNotReady'
  /jobs/{id}/cover.webp:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Jobs]
      operationId: getJobCover
      summary: The job's cut-out card cover
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Cover'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NoCover'

  # ---------------------------------------------------------------- Scenes
  /scenes:
    get:
      tags: [Scenes]
      operationId: listScenes
      summary: The user's scenes, newest first
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/SceneList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [Scenes]
      operationId: createScene
      summary: Save a new scene
      description: Any format version; an older one is converted to version 1. The server picks the id and dates.
      security: [{ sessionCookie: [] }]
      requestBody:
        $ref: '#/components/requestBodies/SceneInput'
      responses:
        '201':
          $ref: '#/components/responses/Scene'
        '400':
          $ref: '#/components/responses/BadScene'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/SceneTooNew'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '503':
          $ref: '#/components/responses/Unavailable'
  /scenes/{id}:
    parameters:
      - $ref: '#/components/parameters/SceneId'
    get:
      tags: [Scenes]
      operationId: getScene
      summary: Load a scene exactly as it was saved
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          $ref: '#/components/responses/Scene'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SceneNotFound'
    put:
      tags: [Scenes]
      operationId: saveScene
      summary: Save a scene (creating it under this id if new)
      security: [{ sessionCookie: [] }]
      requestBody:
        $ref: '#/components/requestBodies/SceneInput'
      responses:
        '200':
          $ref: '#/components/responses/Scene'
        '400':
          $ref: '#/components/responses/BadScene'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SceneNotFound'
        '422':
          $ref: '#/components/responses/SceneTooNew'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
    delete:
      tags: [Scenes]
      operationId: deleteScene
      summary: Delete a scene
      security: [{ sessionCookie: [] }]
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SceneNotFound'

  # -------------------------------------------------------------- Feedback
  /feedback:
    post:
      tags: [Feedback]
      operationId: sendFeedback
      summary: Send feedback
      description: At most 10 per account per hour. Stored in the VM's database.
      security: [{ sessionCookie: [] }]
      requestBody:
        $ref: '#/components/requestBodies/Feedback'
      responses:
        '201':
          $ref: '#/components/responses/FeedbackCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [Feedback]
      operationId: listFeedback
      summary: The admins' feedback inbox, newest first
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/FeedbackCategory'
        - $ref: '#/components/parameters/FeedbackBefore'
      responses:
        '200':
          $ref: '#/components/responses/FeedbackPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/Unavailable'

  # --------------------------------------------------------------- Catalog
  /catalog:
    get:
      tags: [Catalog]
      operationId: getCatalog
      summary: Reference data and limits
      description: Feedback categories, training presets, the photo minimum and the upload limits. Public.
      security: []
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogResponse' }
              example:
                version: 1
                minPhotos: 8
                feedbackCategories:
                  - { id: bug, label: Bug report, icon: triangle, placeholder: 'What did you do, what did you expect, and what happened instead?' }
                  - { id: idea, label: Idea, icon: sparkle, placeholder: 'What would you like GENESIS to do, and what problem would it solve?' }
                  - { id: other, label: Other, icon: message, placeholder: Tell us what you think of GENESIS. }
                feedbackMessage: { minLength: 10, maxLength: 1000 }
                trainingPresets:
                  - { id: fast, label: Fast, iterations: 5000 }
                  - { id: normal, label: Normal, iterations: 7000 }
                  - { id: detailed, label: Detailed, iterations: 10000 }
                defaultTrainingPreset: normal
                limits: { maxPhotos: 300, maxPhotoSizeMB: 30, maxMediaFiles: 10, maxMediaSizeMB: 2048, maxFrameFps: 30, minTrainIters: 1000, maxTrainIters: 30000, maxAvatarKB: 256 }
  /openapi.yaml:
    get:
      tags: [Catalog]
      operationId: getOpenApi
      summary: This document
      security: []
      responses:
        '200':
          description: The OpenAPI document (YAML)
          content:
            application/yaml:
              schema: { type: string }
              example: "openapi: 3.1.0\ninfo:\n  title: Genesis backend API\n  ..."

  # --------------------------------------------------------------- Metrics
  /metrics/page-load:
    post:
      tags: [Metrics]
      operationId: reportPageLoad
      summary: Report how long the website took to load
      description: |
        Sent once per page load by the website (navigator.sendBeacon), from the
        browser's Navigation Timing. Public, because the page loads before
        anyone signs in. Each measure is in ms from 0 to 120000; others are
        ignored. At most 30 reports per IP address per minute.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ttfb: { type: number, minimum: 0, maximum: 120000, description: Time to the first byte of the page }
                fcp: { type: number, minimum: 0, maximum: 120000, description: First contentful paint }
                domContentLoaded: { type: number, minimum: 0, maximum: 120000, description: HTML parsed and scripts run }
                load: { type: number, minimum: 0, maximum: 120000, description: Everything loaded (the load event finished) }
            example: { ttfb: 42.5, fcp: 310.2, domContentLoaded: 288.9, load: 642.1 }
      responses:
        '204':
          description: Recorded
        '400':
          description: No valid measure was sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'Send at least one of ttfb, fcp, domContentLoaded, load, in ms (0-120000).' }
        '429':
          $ref: '#/components/responses/TooManyAttempts'
  /metrics/performance:
    get:
      tags: [Metrics]
      operationId: getPerformance
      summary: API response times and website load times (admins)
      description: |
        p50 / p95 / p99, mean, slowest and counts, per API route (slowest p95
        first) and per page-load measure, for this machine. Times are in ms.
        Percentiles come from per-minute histograms, so they are accurate to
        within their time range (about +-25%); counts, means and maximums
        are exact. Measurements are kept PERF_KEEP_DAYS days (default 7).
      security: [{ sessionCookie: [] }]
      parameters:
        - name: window
          in: query
          required: false
          description: How far back to look (default 24h)
          schema: { enum: ['1h', '24h', '7d'] }
          example: 24h
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceReport' }
              example:
                window: 24h
                from: 1792800000000
                to: 1792886400000
                api:
                  - { route: 'GET /jobs/:id/result.ply', count: 41, errors: 0, mean: 3120.4, p50: 2410.7, p95: 8650.2, p99: 11800.0, max: 12391.6 }
                  - { route: 'POST /upload', count: 6, errors: 0, mean: 1840.2, p50: 1630.0, p95: 2900.4, p99: 2980.1, max: 3001.7 }
                  - { route: 'GET /jobs/:id', count: 1287, errors: 0, mean: 4.1, p50: 3.2, p95: 9.8, p99: 18.5, max: 41.0 }
                pageLoad:
                  - { metric: ttfb, count: 120, mean: 61.3, p50: 48.0, p95: 140.2, p99: 260.4, max: 402.0 }
                  - { metric: fcp, count: 118, mean: 402.7, p50: 351.0, p95: 820.5, p99: 1310.0, max: 1622.4 }
                  - { metric: domContentLoaded, count: 120, mean: 380.4, p50: 330.6, p95: 790.1, p99: 1180.0, max: 1490.3 }
                  - { metric: load, count: 120, mean: 911.0, p50: 760.2, p95: 1980.4, p99: 2700.8, max: 3302.1 }
        '400':
          description: An unknown window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: 'window must be one of 1h, 24h, 7d.' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # -------------------------------------------------------------------- VM
  /register:
    post:
      tags: [VM]
      operationId: vmRegister
      summary: Create an account on the VM (for a team machine's sign-up)
      security: [{ authorityKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 6 }
            example: { name: Alice, email: alice@example.com, password: correct-horse-battery }
      responses:
        '201':
          description: Created; the id is the account's id everywhere
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VmUser' }
              example: { id: 7, email: alice@example.com, name: Alice, role: user }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/KeyRefused'
        '409':
          description: The email is already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: An account with that email already exists. }
        '503':
          $ref: '#/components/responses/NotAuthority'
  /verify-account:
    post:
      tags: [VM]
      operationId: vmVerifyAccount
      summary: Check a password on the VM (for a team machine's sign-in)
      description: Unknown email and wrong password both give `{ valid false }`.
      security: [{ authorityKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
            example: { email: alice@example.com, password: correct-horse-battery }
      responses:
        '200':
          description: Whether the password is right, and the account if so
          content:
            application/json:
              schema:
                oneOf:
                  - allOf:
                      - { $ref: '#/components/schemas/VmUser' }
                      - type: object
                        required: [valid]
                        properties: { valid: { const: true } }
                  - type: object
                    required: [valid]
                    properties: { valid: { const: false } }
              examples:
                right: { value: { valid: true, id: 7, email: alice@example.com, name: Alice, role: user } }
                wrong: { value: { valid: false } }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/KeyRefused'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '503':
          $ref: '#/components/responses/NotAuthority'
  /library/jobs:
    get:
      tags: [VM]
      operationId: vmListJobs
      summary: The user's jobs in the VM's library
      security: [{ authorityKey: [] }]
