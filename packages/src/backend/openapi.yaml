              schema: { $ref: '#/components/schemas/Error' }
              example: { error: result.ply is not a .ply file. }
        '401':
          $ref: '#/components/responses/KeyRefused'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          description: A job with this id is still running on the VM
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: A job with this id is still running on the VM. }
        '413':
          $ref: '#/components/responses/TooLarge'
        '507':
          description: The VM is low on disk space
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: The VM is low on disk space (1.4 GB free). }
