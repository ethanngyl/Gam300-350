        $ref: '#/components/requestBodies/RenameJob'
      responses:
        '200':
          $ref: '#/components/responses/JobRenamed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/KeyOrUserRefused'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          $ref: '#/components/responses/RenameBlocked'
    delete:
      tags: [VM]
      operationId: vmCancelJob
      summary: Cancel a job running on the VM
      security: [{ authorityKey: [] }]
      parameters:
        - $ref: '#/components/parameters/ActAsUser'
      responses:
        '200':
          $ref: '#/components/responses/JobCancelled'
        '401':
          $ref: '#/components/responses/KeyOrUserRefused'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          $ref: '#/components/responses/JobFinished'
    put:
      tags: [VM]
      operationId: vmStoreJob
      summary: Store a finished job sent by a team machine
      description: |
        Photos must be real JPEG / PNG, the model a .ply, the cover a WebP (a bad
        cover is dropped). Replaces an earlier copy. No X-Act-As-User: the owner
        is in the form.
      security: [{ authorityKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images, result, status]
              properties:
                images: { type: array, items: { type: string, format: binary } }
                result: { type: string, format: binary, description: The model (.ply) }
                metrics: { type: string, format: binary, description: metrics.json }
                cover: { type: string, format: binary, description: cover.webp }
                status: { type: string, description: The job's status.json as text }
                ownerId: { type: string, description: The owner's user id (empty = admin-only) }
                origin: { type: string, description: The sending machine's name }
            example: { images: [0000.jpg, 0001.jpg], result: result.ply, metrics: metrics.json, status: '{"version":1,"id":"7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23","status":"done","name":"Fox"}', ownerId: '7', origin: bryans-pc }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [id, bytes]
                properties:
                  id: { type: string }
                  bytes: { type: integer }
              example: { id: 7f3c2a10-5b7e-4c1d-9a2e-0c4b8d6e1f23, bytes: 48211932 }
        '400':
          description: Missing or fake files
          content:
