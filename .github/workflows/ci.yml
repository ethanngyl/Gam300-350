name: CI

# Run on every push and on pull requests targeting main.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: self-hosted   # GitHub's hosted runner

    steps:
      # 1. Get the code
      - name: Check out repository
        uses: actions/checkout@v5

      # 2. Install Node (match your VM's version)
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # 3. Frontend: install exact locked deps, then build.
      #    This build step is what catches the UTF-8 / entry errors
      #    before they ever reach the server.
      - name: Install frontend and backend dependencies
        working-directory: packages
        run: npm ci

      # 4. Backend tests (packages/src/backend/tests, node:test): auth, the
      #    OpenAPI contract, no secrets in the repo, migrations, saved scenes,
      #    API versions and data adapters. Each test runs real servers on
      #    temporary data, never the runner's data/ or jobs/. Blocking.
      - name: Backend tests
        working-directory: packages
        run: npm test

      # 5. Lint the JS/JSX (web app + Node backend). Blocking: any ESLint
      #    error fails the build.
      - name: Lint frontend and backend
        working-directory: packages
        run: npm run lint

      - name: Build frontend
        working-directory: packages/src/web-app
        run: npm run build

  python-checks:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # Provides a known `python` on PATH regardless of the runner OS. The
      # self-hosted Linux runner only has `python3`, so calling `python`
      # directly fails with exit 127.
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'   # matches target-version in ruff.toml

      # Pinned so a new Ruff release can't change results out from under CI.
      # --upgrade forces the pinned version even if an older Ruff is already
      # installed on the self-hosted runner.
      - name: Install Ruff
        run: python -m pip install --quiet --upgrade ruff==0.16.10

      # Print the interpreter and Ruff version actually in use, so a version
      # mismatch (the usual cause of differing results vs. local) is visible.
      - name: Show Ruff version
        run: |
          python --version
          python -m ruff version

      # Lint the Python reconstruction tools. --config pins ruff.toml explicitly
      # so results don't depend on config auto-discovery on the runner.
      # Blocking: any Ruff finding fails the build.
      - name: Lint Python tools
        run: python -m ruff check --config ruff.toml tools

  cpp-lint:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # clang-tidy comes from pip (like Ruff above), so the runner needs no
      # sudo / apt install. It uses the runner's C++ standard library headers
      # (g++ / build-essential).
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # Pinned so a new clang-tidy release can't change results out from under CI.
      - name: Install clang-tidy
        run: python -m pip install --quiet --upgrade clang-tidy==22.1.8

      # Lint the engine's renderer code (src/gfx, src/splat) with the checks in
      # engine/.clang-tidy. See engine/lint-cpp.sh. Blocking: any finding
      # fails the build.
      - name: Lint engine C++ (clang-tidy)
        run: bash engine/lint-cpp.sh
